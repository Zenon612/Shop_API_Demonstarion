[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-shop-api"
version = "1.1.0"
description = "Demo FastAPI backend project with PostgreSQL, Redis, Celery, and Kafka"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Demo", email = "demo@example.com"},
]
keywords = [
    "fastapi",
    "async",
    "postgresql",
    "redis",
    "celery",
    "kafka",
    "prometheus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.5",
    "aiokafka==0.14.0",
    "aioredis==2.0.1",
    "aiosignal==1.4.0",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "amqp==5.3.1",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "async-timeout==5.0.1",
    "asyncpg==0.31.0",
    "attrs==26.1.0",
    "bcrypt==5.0.0",
    "billiard==4.2.4",
    "celery==5.6.3",
    "celery-types==0.26.0",
    "certifi==2026.4.22",
    "cffi==2.0.0",
    "click==8.3.3",
    "click-didyoumean==0.3.1",
    "click-plugins==1.1.1.2",
    "click-repl==0.3.0",
    "colorama==0.4.6",
    "cryptography==48.0.0",
    "dnspython==2.8.0",
    "ecdsa==0.19.2",
    "email-validator==2.3.0",
    "fastapi==0.136.1",
    "frozenlist==1.8.0",
    "greenlet==3.5.0",
    "h11==0.16.0",
    "idna==3.13",
    "kombu==5.6.2",
    "loguru==0.7.3",
    "Mako==1.3.12",
    "MarkupSafe==3.0.3",
    "multidict==6.7.1",
    "packaging==26.2",
    "prometheus-fastapi-instrumentator==7.1.0",
    "prometheus-client==0.25.0",
    "prompt-toolkit==3.0.52",
    "propcache==0.5.2",
    "psycopg2-binary==2.9.12",
    "pyasn1==0.6.3",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.0",
    "pydantic-core==2.46.4",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "redis==7.4.0",
    "rsa==4.9.1",
    "ruff==0.15.12",
    "sentry-sdk==2.60.0",
    "six==1.17.0",
    "SQLAlchemy==2.0.49",
    "starlette==0.52.1",
    "typing-inspection==0.4.2",
    "typing-extensions==4.15.0",
    "tzdata==2026.2",
    "tzlocal==5.3.1",
    "urllib3==2.7.0",
    "uvicorn==0.46.0",
    "vine==5.1.0",
    "wcwidth==0.7.0",
    "win32-setctime==1.2.0",
    "yarl==1.23.0",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.7.1",
]

[project.urls]
Homepage = "https://github.com/yourusername/demo"
Documentation = "https://github.com/yourusername/demo#readme"
Repository = "https://github.com/yourusername/demo.git"
Issues = "https://github.com/yourusername/demo/issues"

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
